    <style>
      html, body {
        background-color: #0C0C0C !important;
        color: #D7E2EA !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: clip;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #0C0C0C;
      }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0C0C0C;
        color: #D7E2EA;
        z-index: 9999;
        font-family: 'Space Mono', monospace;
      }
      .loader-pulse {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(circle, #E11D48 0%, rgba(225, 29, 72, 0) 70%);
        animation: pulseGlow 1.8s ease-in-out infinite;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-ring {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(225, 29, 72, 0.4);
        border-top-color: #F59E0B;
        border-radius: 50%;
        animation: spinRing 1.1s linear infinite;
      }
      @keyframes spinRing {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
    </style>
  </head>
  <body class="bg-[#0C0C0C] text-[#D7E2EA] antialiased selection:bg-[#E11D48] selection:text-white">
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <div class="loader-pulse">
          <div class="loader-ring"></div>
        </div>
        <div style="margin-top: 24px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; font-size: 13px; color: #FFFFFF;">

    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
